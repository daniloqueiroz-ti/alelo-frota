<div class="conteudo">

    <div class="float-direita">
        <img src="../../../assets/img/car.png">
    </div>
    <div mat-dialog-content>
        <h1 mat-dialog-title class="mb-4">Update Vehicle</h1>
        <form class="form" id="add-form" (ngSubmit)="save()" [formGroup]="formulario" novalidate>

            <mat-card class="fundo-lightcoral" *ngIf="msgError"><span>{{ msgError }}</span></mat-card>

            <div class="form-group" hidden>
                <label class="label-form" for="id">id</label>
                <input type="text" id="id" formControlName="id" class="form-control">
            </div>

            <div class="form-group">
                <label class="label-form" for="plate">Plate</label>
                <input type="text" id="plate" formControlName="plate" class="form-control" placeholder="ABC - 1234" [ngClass]="aplicaCssErro('plate')">
                <div *ngIf="verificaValidTouched('plate')">
                    <span class="font-red">This field is required</span>
                </div>
            </div>

            <div class="form-group">
                <label class="label-form" for="model">Model</label>
                <input type="text" id="model" formControlName="model" class="form-control" placeholder="Class C 1.6 Avantgarde Turbo Flex" [ngClass]="aplicaCssErro('model')">
                <div *ngIf="verificaValidTouched('model')">
                    <span class="font-red">This field is required</span>
                </div>
            </div>

            <div class="form-group">
                <label class="label-form" for="manufacturer">Manufacturer</label>
                <input type="text" id="manufacturer" formControlName="manufacturer" class="form-control" placeholder="Mercedez-Benz" [ngClass]="aplicaCssErro('manufacturer')">
                <div *ngIf="verificaValidTouched('manufacturer')">
                    <span class="font-red">This field is required</span>
                </div>
            </div>

            <div class="form-group">
                <label class="label-form" for="color">Color</label>
                <input type="text" id="color" formControlName="color" class="form-control" placeholder="Black" [ngClass]="aplicaCssErro('color')">
                <div *ngIf="verificaValidTouched('color')">
                    <span class="font-red">This field is required</span>
                </div>
            </div>

            <div class="form-group form-check">
                <input type="checkbox" id="status" formControlName="status" class="form-check-input ck-input label-form" checked>
                <label class="label-form form-check-label" for="status">Active</label>
            </div>

            <div class="d-flex aling-btn">
                <button class="btn-between" type="reset" mat-raised-button (click)="resetar()">
                        Reset All</button>
                <button class="btn-between btn-save" type="submit" mat-raised-button color="primary" [disabled]="!formulario.valid">
                        Save</button>
            </div>
        </form>
    </div>
</div>
